name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm run check:lock
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:docs
      - run: npm run diagrams
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  api:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.13.6
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not postgres"
      - run: python scripts/validate_repository.py
      - run: git diff --check
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_local
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sentinel -d sentinel_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sentinel:sentinel_local@127.0.0.1:5432/sentinel_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.13.6
      - run: uv sync --frozen
      - run: uv run pytest -m postgres
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python scripts/setup/smoke.py
      - run: docker compose stop api
      - run: python scripts/setup/smoke.py --expect-unavailable
      - run: docker compose start api
      - run: docker compose up --wait --wait-timeout 60
      - run: python scripts/setup/smoke.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --remove-orphans --volumes
