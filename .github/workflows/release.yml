name: Approved ECR release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version (vMAJOR.MINOR.PATCH or -rc.N)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: approved-ecr-release
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Require operator configuration and protected staging gate
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_ENABLED: ${{ vars.DELIVERY_ENABLED }}
        run: |
          test "$DELIVERY_ENABLED" = true
          python scripts/delivery.py check-environment --environment staging
          python scripts/delivery.py check-source --source "$GITHUB_SHA"
  publish:
    needs: preflight
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: python scripts/security_tools.py trivy cosign
      - name: Short-lived AWS federation
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: sentinel-release-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Login to approved existing ECR registry
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Scan, publish immutable images, sign and attest
        env:
          VERSION: ${{ inputs.version }}
          ECR_PREFIX: ${{ vars.ECR_PREFIX }}
        run: python scripts/image_delivery.py publish --version "$VERSION" --prefix "$ECR_PREFIX"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: .cache/delivery/release/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publish reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --draft --target "$GITHUB_SHA" --title "$VERSION" --notes-file CHANGELOG.md .cache/delivery/release/*.json
      - if: always()
        run: docker logout
