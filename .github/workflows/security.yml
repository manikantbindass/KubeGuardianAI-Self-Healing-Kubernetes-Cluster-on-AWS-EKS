name: Secure delivery checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.13.6
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - run: python scripts/security_tools.py actionlint gitleaks trivy kubeconform
      - run: actionlint -color
      - run: uv sync --frozen
      - run: uv sync --project .github/security --frozen
      - name: Verify patched scanner cryptographic boundaries
        run: uv run --project .github/security python .github/security/checkov-patch/test_crypto.py
      - run: uv run --project .github/security python scripts/validate_delivery.py
      - run: uv run pytest tests/unit/test_delivery.py -q
      - name: Scan full Git history without disclosing secrets
        run: gitleaks git --redact --report-format json --report-path .cache/delivery/gitleaks.json .
      - name: Dependency and tracked-source scan
        run: |
          git ls-files -z | tar --null -T - -cf .cache/delivery/source.tar
          mkdir -p .cache/delivery/source
          tar -xf .cache/delivery/source.tar -C .cache/delivery/source
          trivy fs --scanners vuln,secret --format json --output .cache/delivery/dependencies.json .cache/delivery/source
          python scripts/security_gate.py trivy .cache/delivery/dependencies.json
      - name: Terraform checks with locked Checkov
        run: |
          uv sync --project .github/security --frozen
          set +e
          uv run --project .github/security checkov -d infrastructure/terraform --framework terraform --skip-download --output json > .cache/delivery/checkov.json
          result=$?
          set -e
          test "$result" -le 1
          python scripts/security_gate.py checkov .cache/delivery/checkov.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-static-evidence
          path: |
            .cache/delivery/gitleaks.json
            .cache/delivery/dependencies.json
            .cache/delivery/checkov.json
            .cache/delivery/gitops-validation.json
          include-hidden-files: true
          retention-days: 14
  image-security:
    name: image-security (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [api, dashboard, operator, detector, demo-workload]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: python scripts/security_tools.py trivy
      - name: Build and enforce image security policy
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE: ${{ github.sha }}
        run: python scripts/image_delivery.py build --component "$COMPONENT" --source "$SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-security-${{ matrix.component }}
          path: .cache/delivery/images/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
