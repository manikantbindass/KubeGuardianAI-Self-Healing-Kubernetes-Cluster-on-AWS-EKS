name: Operations dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-bookworm
        env: {POSTGRES_USER: sentinel, POSTGRES_PASSWORD: sentinel_local, POSTGRES_DB: sentinel}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2.2-bookworm
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.13.6
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv sync --frozen --extra ops
      - run: uv run python scripts/setup/operations_env.py --development --demo
      - run: uv run alembic -c apps/api/alembic.ini upgrade head
      - run: npm run build
      - run: uv run python scripts/test_operations_dashboard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: operations-browser-evidence
          path: |
            .cache/operations/e2e-results.json
            .cache/operations/api.log
            .cache/operations/web.log
            docs/screenshots/phase-07
          include-hidden-files: true
          if-no-files-found: warn
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10-bookworm
        env: {POSTGRES_USER: sentinel, POSTGRES_PASSWORD: sentinel_local, POSTGRES_DB: sentinel}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2.2-bookworm
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: operator/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.13.6
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - name: Install pinned kind
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64 -o /tmp/kind
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - run: uv sync --frozen --extra ops
      - run: uv run python scripts/setup/operations_env.py --development
      - run: uv run alembic -c apps/api/alembic.ini upgrade head
      - run: python scripts/recovery_lab.py bootstrap --execute
      - run: uv run python scripts/test_operations_cluster.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: operations-real-kind-evidence
          path: |
            .cache/operations/cluster-results.json
            .cache/operations/cluster-api.log
          include-hidden-files: true
          if-no-files-found: warn
      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context kind-kubesentinel-recovery -n sentinel-lab get pods,events,remediationactions
          kubectl --context kind-kubesentinel-recovery -n sentinel-lab logs -l app=sentinel-recovery --all-containers --tail=100
      - if: always()
        run: python scripts/recovery_lab.py clean
