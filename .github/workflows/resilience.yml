name: Safe resilience checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.13.6
      - run: uv sync --frozen
      - run: uv run pytest tests/unit/test_resilience.py -q
      - run: uv run python scripts/benchmark_http.py --start-api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: safe-http-benchmark
          path: |
            .cache/benchmarks/http/raw.csv
            .cache/benchmarks/http/summary.json
          include-hidden-files: true
          retention-days: 14
