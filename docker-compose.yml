name: kubesentinel-ai
x-backend: &backend
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_local}@postgres:5432/${POSTGRES_DB:-sentinel}
    REDIS_URL: redis://redis:6379/0
    APP_ENV: local
    ESCALATION_ENABLED: ${ESCALATION_ENABLED:-false}
    ESCALATION_URL: ${ESCALATION_URL:-}
    ESCALATION_IP: ${ESCALATION_IP:-}
    ESCALATION_SIGNING_SECRET: ${ESCALATION_SIGNING_SECRET:-}
    ESCALATION_MAX_ATTEMPTS: ${ESCALATION_MAX_ATTEMPTS:-5}
    ESCALATION_MAX_PENDING: ${ESCALATION_MAX_PENDING:-1000}
    ESCALATION_TIMEOUT_SECONDS: ${ESCALATION_TIMEOUT_SECONDS:-3}
    CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_local}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.2-bookworm
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [alembic, -c, alembic.ini, upgrade, head]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    <<: *backend
    command: [python, -m, kubesentinel_api.worker]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    ports: ["127.0.0.1:${DASHBOARD_PORT:-3000}:3000"]
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/dashboard/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres-data:
  redis-data:
