---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sentinel, component: prometheus}
  template:
    metadata:
      annotations:
        checksum/config: {{ print ((.Files.Glob "files/*").AsConfig) ((.Files.Glob "dashboards/*").AsConfig) | sha256sum }}
      labels: {app: sentinel, component: prometheus}
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: {{ index .Values.images "prometheus" }}
          args: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/data","--storage.tsdb.retention.time={{ .Values.retention }}","--storage.tsdb.retention.size=1GB"]
          ports: [{name: http, containerPort: 9090}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            failureThreshold: 90
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - name: config
          projected:
            sources:
              - configMap: {name: obs-prometheus}
              - configMap: {name: obs-rules}
        - {name: data, persistentVolumeClaim: {claimName: obs-prometheus}}

---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  selector: {app: sentinel, component: prometheus}
  ports: [{port: 9090, targetPort: http, name: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: obs-prometheus}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: {{ .Values.storageSize }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sentinel, component: alertmanager}
  template:
    metadata:
      annotations:
        checksum/config: {{ print ((.Files.Glob "files/*").AsConfig) ((.Files.Glob "dashboards/*").AsConfig) | sha256sum }}
      labels: {app: sentinel, component: alertmanager}
    spec:
      serviceAccountName: obs-no-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alertmanager
          image: {{ index .Values.images "alertmanager" }}
          args: ["--config.file=/etc/alertmanager/alertmanager.yml","--storage.path=/data","--data.retention=120h"]
          ports: [{name: http, containerPort: 9093}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            failureThreshold: 90
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
            - {name: token, mountPath: /var/run/telemetry, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: config, configMap: {name: obs-alertmanager}}
        - {name: token, secret: {secretName: {{ .Values.secretName }}, items: [{key: TELEMETRY_TOKEN, path: TELEMETRY_TOKEN}]}}
        - {name: data, persistentVolumeClaim: {claimName: obs-alertmanager}}

---
apiVersion: v1
kind: Service
metadata: {name: alertmanager}
spec:
  selector: {app: sentinel, component: alertmanager}
  ports: [{port: 9093, targetPort: http, name: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: obs-alertmanager}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: {{ .Values.storageSize }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sentinel, component: grafana}
  template:
    metadata:
      annotations:
        checksum/config: {{ print ((.Files.Glob "files/*").AsConfig) ((.Files.Glob "dashboards/*").AsConfig) | sha256sum }}
      labels: {app: sentinel, component: grafana}
    spec:
      serviceAccountName: obs-no-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: {{ index .Values.images "grafana" }}
          args: []
          ports: [{name: http, containerPort: 3000}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            failureThreshold: 90
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
            timeoutSeconds: 5

          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.grafanaSecretName }}, key: GRAFANA_ADMIN_PASSWORD}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: data, persistentVolumeClaim: {claimName: obs-grafana}}
        - {name: datasources, configMap: {name: obs-datasources}}
        - {name: providers, configMap: {name: obs-dashboards}}
        - {name: dashboards, configMap: {name: obs-dashboards-data}}

---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app: sentinel, component: grafana}
  ports: [{port: 3000, targetPort: http, name: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: obs-grafana}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: {{ .Values.storageSize }}}
