---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sentinel, component: kube-state-metrics}
  template:
    metadata:
      annotations:
        checksum/config: {{ print ((.Files.Glob "files/*").AsConfig) ((.Files.Glob "dashboards/*").AsConfig) | sha256sum }}
      labels: {app: sentinel, component: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kube-state-metrics
          image: {{ index .Values.images "kube-state-metrics" }}
          args: ["--resources=pods,nodes,deployments,replicasets","--namespaces=kubesentinel"]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 90
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}

---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics}
spec:
  selector: {app: sentinel, component: kube-state-metrics}
  ports: [{port: 8080, targetPort: http, name: http}]
