extensions:
  health_check: {endpoint: "0.0.0.0:13133"}
  file_storage: {directory: /var/lib/otel}
receivers:
  otlp:
    protocols:
      http: {endpoint: "0.0.0.0:4318"}
  filelog:
    include: [/var/log/pods/kubesentinel_sentinel-api-*/*/*.log]
    start_at: beginning
    include_file_path: true
    storage: file_storage
    operators:
      - type: container
        id: container-parser
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 192, spike_limit_mib: 48}
  resource:
    attributes:
      - {key: service.name, value: sentinel-api, action: upsert}
      - {key: deployment.environment.name, value: local, action: upsert}
  batch: {timeout: 2s, send_batch_size: 256}
exporters:
  otlphttp/loki:
    endpoint: http://loki.kubesentinel.svc:3100/otlp
    sending_queue: {enabled: true, queue_size: 1000}
    retry_on_failure: {enabled: true, max_elapsed_time: 60s}
  debug: {verbosity: basic}
service:
  extensions: [health_check, file_storage]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    logs:
      receivers: [filelog]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]
