apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nameOverride }}-config
data:
  APP_ENV: {{ .Values.environment | quote }}
  LOG_LEVEL: INFO
  API_BASE_URL: http://{{ .Values.nameOverride }}-api:8000
  CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.nameOverride }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.nameOverride }}-observer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.nameOverride }}-observer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ .Values.nameOverride }}-api, {{ .Values.nameOverride }}-dashboard, {{ .Values.nameOverride }}-worker]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.nameOverride }}-observer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.nameOverride }}-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.nameOverride }}-observer
