apiVersion: batch/v1
kind: Job
metadata:
  {{- if .Values.migration.gitopsHook }}
  name: {{ .Values.nameOverride }}-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  {{- else }}
  name: {{ .Values.nameOverride }}-migrate-{{ .Release.Revision }}
  {{- end }}
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: {{ .Values.nameOverride }}, component: migrate}
    spec:
      serviceAccountName: {{ .Values.nameOverride }}
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: {{ include "sentinel.image" (list .Values "api") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [alembic, -c, alembic.ini, upgrade, head]
          envFrom:
            - secretRef: {name: {{ .Values.secretName }}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
