nameOverride: sentinel
rbac:
  create: true
corsOrigins: ["http://localhost:3000", "http://127.0.0.1:3000"]
networkPolicy:
  extraIngress: []
  extraEgress: []
environment: local
secretName: sentinel-runtime
image:
  api: kubesentinel/api
  dashboard: kubesentinel/dashboard
  tag: phase02
  pullPolicy: IfNotPresent
  requireDigests: false
  digests: {api: "", dashboard: ""}
migration:
  gitopsHook: false
replicas: 1
localStores: true
postgresImage: postgres:17.10-bookworm
redisImage: redis:8.2.2-bookworm
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
ingress:
  enabled: false
  className: ""
  host: sentinel.local
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 70
pdb:
  enabled: false
observability:
  enabled: false
  annotations: {}

# Opt-in authenticated operations UI. Secret objects are supplied out of band.
operations:
  enabled: false
  authMode: oidc
  issuer: ""
  audience: kubesentinel-api
  jwksURL: ""
  rolesClaim: kubesentinel_roles
  namespaces: [kubesentinel, sentinel-lab]
  demoEnabled: false
  publicURL: https://sentinel.example.invalid
  apiSecretName: sentinel-operations-api
  dashboardSecretName: sentinel-operations-web
  approvalSecretName: ""
  approvalKeyID: dashboard-approver
  detectorURL: ""
  lokiURL: ""
