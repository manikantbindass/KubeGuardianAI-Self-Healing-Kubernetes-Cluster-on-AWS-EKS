# Optional: dedicated namespace-scoped External Secrets controller using EKS Pod Identity.
# Install/pin the controller and its v1 CRDs separately; no secret values belong here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-secret-reader
  namespace: sentinel-staging
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sentinel-aws
  namespace: sentinel-staging
spec:
  controller: sentinel-staging
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinel-runtime
  namespace: sentinel-staging
spec:
  refreshInterval: 1h
  secretStoreRef: {name: sentinel-aws, kind: SecretStore}
  target:
    name: sentinel-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: {key: /kubesentinel/staging/runtime}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinel-operations-api
  namespace: sentinel-staging
spec:
  refreshInterval: 1h
  secretStoreRef: {name: sentinel-aws, kind: SecretStore}
  target:
    name: sentinel-operations-api
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: {key: /kubesentinel/staging/operations-api}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinel-operations-web
  namespace: sentinel-staging
spec:
  refreshInterval: 1h
  secretStoreRef: {name: sentinel-aws, kind: SecretStore}
  target:
    name: sentinel-operations-web
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: {key: /kubesentinel/staging/operations-web}
